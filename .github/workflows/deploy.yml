name: CD - Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests Prior to Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit test suite
        run: |
          pytest -v -m "not integration"

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH (OpenSSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" bash -e << 'EOF'
            echo "==> Iniciando publicação contínua do py-brcompany-api..."
            git config --global --add safe.directory /opt/py-brcompany-api 2>/dev/null || true
            cd /opt/py-brcompany-api

            echo "==> Atualizando código a partir da branch main..."
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Atualizando dependências no ambiente virtual..."
            .venv/bin/pip install --upgrade pip setuptools wheel
            .venv/bin/pip install -e .

            echo "==> Atualizando unit do systemd se houver alterações..."
            if command -v sudo >/dev/null 2>&1; then
              sudo cp /opt/py-brcompany-api/deploy/py-brcompany-api.service /etc/systemd/system/ 2>/dev/null || true
              sudo systemctl daemon-reload 2>/dev/null || true
              sudo systemctl restart py-brcompany-api
              echo "==> Serviço py-brcompany-api reiniciado com sucesso."
            fi

            echo "==> Atualizando configuração do Nginx para a API se houver..."
            if command -v nginx >/dev/null 2>&1 && [ -f /opt/py-brcompany-api/deploy/nginx.conf ]; then
              if command -v sudo >/dev/null 2>&1; then
                sudo cp /opt/py-brcompany-api/deploy/nginx.conf /etc/nginx/sites-available/py-brcompany-api 2>/dev/null || true
                sudo ln -sf /etc/nginx/sites-available/py-brcompany-api /etc/nginx/sites-enabled/ 2>/dev/null || true
                if sudo nginx -t >/dev/null 2>&1; then
                  sudo systemctl reload nginx 2>/dev/null || true
                  echo "==> Nginx recarregado com sucesso para a API."
                fi
              fi
            fi

            echo "==> Validando status de saúde na porta 8040..."
            sleep 3
            curl -f http://127.0.0.1:8040/health || (echo "ERRO: Health check falhou!" && exit 1)

            echo "==> Deploy da API concluído com sucesso!"
          EOF
