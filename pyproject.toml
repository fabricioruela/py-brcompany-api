[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-brcompany-api"
version = "0.1.0"
description = "High-performance async REST API for Brazilian CNPJ Registry data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "psycopg_pool>=3.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
brcompany-api = "brcompany_api.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src/brcompany_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
